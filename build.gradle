plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'com.codeborne:selenide:7.14.0'
    testImplementation("net.datafaker:datafaker:2.5.4")
}

test {
    useJUnitPlatform()
}

task negativeTest(type: Test) {                    // - подключаем таску для негативных тестов
    useJUnitPlatform {
        includeTags 'negative'
    }
}